[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-news-agent"
version = "0.1.0"
description = "Local, measurable news research agent for Hermes 3 (Llama 3.2 3B) and Hermes Agent"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "feedparser>=6.0", "httpx>=0.27", "pydantic>=2.7", "python-dotenv>=1.0", "websockets>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
news-agent = "local_news_agent.cli:main"

[tool.setuptools.packages.find]
include = ["local_news_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
