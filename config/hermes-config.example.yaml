# Merge this block into ~/.hermes/config.yaml. Hermes currently requires a
# declared context of at least 64K even though this project's compact planner
# normally uses 8K directly against Ollama.
model:
  default: qwen2.5-coder:3b
  provider: custom
  base_url: http://localhost:11434/v1
  context_length: 65536

