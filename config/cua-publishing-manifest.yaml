version: 3
expires_after: 10m
idle_timeout: 5m

resources:
  apps:
    - executable: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      launch: false
      windows: all
      terminate: deny
  browser:
    profiles:
      - kind: existing_profile
    origins:
      - https://x.com
      - https://www.threads.com
      - https://studio.youtube.com
      - https://www.youtube.com
      - https://youtube.com
  files:
    read:
      - dir: 'C:\Users\user\Downloads\Agent Flow\data\shorts'
        recursive: false
  desktop:
    display: false

allow:
  tools:
    - start_session
    - end_session
    - list_windows
    - get_browser_state
    - browser_prepare
    - browser_navigate
    - browser_click
    - browser_type
    - browser_set_input_files
